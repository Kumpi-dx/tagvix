; =====================================================================
;  TagVix  -  Omron CP1E (Serial Host Link)  ->  MySQL
;  File konfigurasi terpisah. Bisa diubah tanpa build ulang.
; =====================================================================
;  Cara pakai singkat:
;   1. Isi [plc] sesuai port COM & setting serial PLC.
;   2. Isi [database] sesuai server MySQL.
;   3. Definisikan tag di [tags].
;   4. Jalankan tagvix.exe
; =====================================================================

[plc]
; Protocol komunikasi: hostlink | modbus_rtu | modbus_tcp | fins_tcp
;   hostlink   = Omron CP/CS/CJ (area DM/CIO/IR/LR), via serial
;   modbus_rtu = perangkat Modbus via serial (RS-232/RS-485)
;   modbus_tcp = perangkat Modbus via jaringan (Ethernet)
;   fins_tcp   = Omron CJ2M/CS/CP via Ethernet (FINS/TCP, area DM/CIO/WR/HR/AR)
protocol = hostlink
; Nama port serial. Contoh: COM3, COM5  (hostlink & modbus_rtu)
port = COM3
; Baud rate 9600 / 19200 / 38400 / 57600 / 115200
baudrate = 9600
; Data bits: 7 atau 8
bytesize = 7
; Parity: N (none) | E (even) | O (odd)
parity = E
; Stop bits: 1 | 2
stopbits = 2
; Timeout baca tulis (detik)
timeout = 1.0
; Unit / station number PLC host link (0-31)
unit_no = 0
; Jumlah retry tiap transaksi bila gagal
retries = 3
; Jeda antar retry (detik)
retry_delay = 0.3
; true = mode simulasi (tanpa perangkat, untuk uji)
simulate = false
; true = otomatis pindah PLC ke mode MONITOR saat start (agar bisa tulis dari
; DB; ladder tetap berjalan). false = biarkan PLC apa adanya (mode manual).
auto_monitor = true

; --- Modbus ---
; Slave / device ID perangkat Modbus (1-247)
slave_id = 1
; Host / IP perangkat Modbus TCP
tcp_host = 127.0.0.1
; Port TCP Modbus (default 502)
tcp_port = 502
; Basis alamat register: 0 = alamat langsung (40001 -> 0), 1 = gaya referensi (40001 -> 40000)
address_base = 0
; Urutan word untuk tipe 32-bit (DINT/UDINT/REAL): little (low dulu) | big (high dulu)
word_order = little

; --- Omron FINS/TCP ---
; Host / IP PLC Omron (Ethernet)
fins_host = 127.0.0.1
; Port FINS/TCP (default 9600)
fins_port = 9600
; Node tujuan (DA1). 0 = otomatis / koneksi langsung
fins_dest_node = 0
; Node sumber (SA1). 0 = otomatis
fins_src_node = 0
; Network address (DNA / SNA), biasanya 0 untuk jaringan lokal
fins_dna = 0
fins_sna = 0
; Unit address (DA2 / SA2): 0 = CPU, 0xE1 = unit Ethernet
fins_da2 = 0
fins_sa2 = 0

[polling]
; Interval antar siklus pembacaan (detik)
interval = 1.0
; Jeda sebelum mencoba menyambung ulang setelah error fatal (detik)
reconnect_delay = 5.0

[database]
; Aktifkan penyimpanan ke MySQL
enabled = true
host = 127.0.0.1
port = 3306
user = root
password = 
database = db_myopc_tagvix
; Tabel baca: nilai PLC di-update ke sini (DEV_NAME + GROUP_NAME + TAG_NAME)
table_reg = t_reg_status
; Tabel tulis: perintah tulis dari DB diteruskan ke PLC (REG_NAME -> REG_VALUE)
table_transmit = t_transmit
; Identitas perangkat & grup yang dipakai pada tabel status
dev_name = OMRON
group_name = default
; true = buat database & tabel otomatis bila belum ada
autocreate = true

[logging]
; Level: DEBUG | INFO | WARNING | ERROR
level = INFO
; File log (relatif terhadap folder aplikasi)
file = logs/tagvix.log
; Ukuran maksimum file log (bytes) sebelum dirotasi
max_bytes = 1048576
; Jumlah file backup log
backup_count = 5
; Tampilkan log ke console juga
console = true

[tags]
d200 = DM:200:INT:1:
d100 = DM:100:INT:1:
